name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build MUI demo
        run: npm run build
        env:
          GITHUB_ACTIONS: true

      - name: Build DaisyUI demo
        run: npm run build:daisyui
        env:
          GITHUB_ACTIONS: true

      - name: Assemble site
        run: |
          mkdir -p dist/site
          cp -r dist/apps/demo/* dist/site/
          mkdir -p dist/site/daisyui
          cp -r dist/apps/demo-daisyui/* dist/site/daisyui/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
